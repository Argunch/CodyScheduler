<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ученики</title>
    <link rel="stylesheet" href="{% static 'css/students.css' %}">
</head>
<body>
    <div class="students-container">
        <!-- Шапка -->
        <header class="students-header">
            <a href="{% url 'home' %}" class="back-link">← Назад к расписанию</a>
            <h1>Управление учениками</h1>
        </header>

        <!-- Основной контент -->
        <main class="students-main">
            <!-- Кнопка добавления ученика -->
            <button id="add-student-btn" class="add-student-btn">
                <span class="btn-icon">+</span>
                Добавить ученика
            </button>

            <!-- Список учеников -->
            <div id="students-list" class="students-list">
                <!-- Список будет загружен через JavaScript -->
            </div>
        </main>
    </div>

    {% include 'partials/_student_modals.html' %}
    {% include 'partials/_course_modals.html' %}

    <script type="module" src="{% static 'scripts/main.js' %}"></script>
</body>
</html>
